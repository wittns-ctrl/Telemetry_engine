<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010" font-family="Segoe UI, Plus Jakarta Sans, Arial, sans-serif">
  <title>Lectio system architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#45454c"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c7a2e"/>
    </marker>
    <style>
      .zone { fill: #f5f5f6; stroke: #d9d9dc; stroke-width: 1.5; }
      .box { fill: #fff; stroke: #b9b9bf; stroke-width: 1.2; }
      .dark { fill: #0e0e10; }
      .green { fill: #eaf5ec; stroke: #5cc061; stroke-width: 1.4; }
      .ext { fill: #fff; stroke: #8e8e96; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .zt { font-size: 15px; font-weight: 700; fill: #0e0e10; }
      .zs { font-size: 12px; fill: #5f5f68; }
      .bt { font-size: 14px; font-weight: 650; fill: #0e0e10; }
      .bs { font-size: 11.5px; fill: #45454c; }
      .wt { font-size: 14px; font-weight: 650; fill: #fff; }
      .ws { font-size: 11.5px; fill: #d9d9dc; }
      .lbl { font-size: 11.5px; fill: #232327; font-weight: 600; }
      .lbs { font-size: 10.5px; fill: #5f5f68; }
      .ln { stroke: #45454c; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .lg { stroke: #1c7a2e; stroke-width: 1.8; fill: none; marker-end: url(#g); }
      .ld { stroke: #8e8e96; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); }
    </style>
  </defs>

  <rect width="1600" height="1010" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0e0e10">Lectio — system architecture</text>
  <text x="40" y="68" font-size="13" fill="#5f5f68">Free PC health, security and location monitoring for Windows · November 2026 · agent 1.2.0</text>

  <!-- ============ Windows PC ============ -->
  <rect class="zone" x="40" y="100" width="430" height="560" rx="16"/>
  <text class="zt" x="62" y="130">Each monitored Windows PC</text>
  <text class="zs" x="62" y="148">Windows 10 / 11 · installed from GitHub Releases</text>

  <rect class="dark" x="62" y="164" width="386" height="300" rx="12"/>
  <text class="wt" x="80" y="190">Lectio Agent service (Go, LocalSystem)</text>
  <text class="ws" x="80" y="208">starts with Windows · restarts itself if it stops</text>
  <g>
    <rect x="80" y="222" width="172" height="58" rx="8" fill="#232327"/>
    <text class="wt" x="92" y="244" font-size="12.5">Collectors · every 5 s</text>
    <text class="ws" x="92" y="262">CPU, GPU, RAM, disks, network,</text>
    <text class="ws" x="92" y="275">processes, hardware errors</text>
    <rect x="262" y="222" width="168" height="58" rx="8" fill="#232327"/>
    <text class="wt" x="274" y="244" font-size="12.5">Security · every 2 min</text>
    <text class="ws" x="274" y="262">Microsoft Defender status,</text>
    <text class="ws" x="274" y="275">threats, disguised programs</text>
    <rect x="80" y="290" width="172" height="58" rx="8" fill="#232327"/>
    <text class="wt" x="92" y="312" font-size="12.5">Disk buffer</text>
    <text class="ws" x="92" y="330">readings kept offline</text>
    <text class="ws" x="92" y="343">up to 7 days / 100 MB</text>
    <rect x="262" y="290" width="168" height="58" rx="8" fill="#232327"/>
    <text class="wt" x="274" y="312" font-size="12.5">Uploader</text>
    <text class="ws" x="274" y="330">batches, retries with</text>
    <text class="ws" x="274" y="343">back-off, oldest first</text>
    <rect x="80" y="358" width="110" height="88" rx="8" fill="#232327"/>
    <text class="wt" x="92" y="380" font-size="12.5">Fix worker</text>
    <text class="ws" x="92" y="398">polls 10 s; own</text>
    <text class="ws" x="92" y="411">catalogue; asks</text>
    <text class="ws" x="92" y="424">at the PC for</text>
    <text class="ws" x="92" y="437">big fixes</text>
    <rect x="200" y="358" width="110" height="88" rx="8" fill="#232327"/>
    <text class="wt" x="212" y="380" font-size="12.5">Notifier</text>
    <text class="ws" x="212" y="398">polls 15 s for</text>
    <text class="ws" x="212" y="411">new critical</text>
    <text class="ws" x="212" y="424">alerts</text>
    <rect x="320" y="358" width="110" height="88" rx="8" fill="#232327"/>
    <text class="wt" x="332" y="380" font-size="12.5">Locator</text>
    <text class="ws" x="332" y="398">every 2 min when</text>
    <text class="ws" x="332" y="411">the owner opted</text>
    <text class="ws" x="332" y="424">in</text>
  </g>

  <rect class="box" x="62" y="482" width="386" height="78" rx="12"/>
  <text class="bt" x="80" y="506">Helper in the signed-in user's session</text>
  <text class="bs" x="80" y="526">“lectio-agent notify” → Windows notification with</text>
  <text class="bs" x="80" y="541">Open dashboard · “lectio-agent locate” → Windows Location</text>
  <path class="ln" d="M265,446 L265,482"/>
  <path class="ln" d="M375,446 L375,482"/>

  <rect class="box" x="62" y="576" width="386" height="66" rx="12"/>
  <text class="bt" x="80" y="600">Windows itself</text>
  <text class="bs" x="80" y="619">WMI · Defender (MpCmdRun) · Location service ·</text>
  <text class="bs" x="80" y="633">Service Control Manager · Event log (WHEA)</text>

  <!-- ============ Browser ============ -->
  <rect class="zone" x="40" y="690" width="430" height="270" rx="16"/>
  <text class="zt" x="62" y="720">Owner's web browser</text>
  <text class="zs" x="62" y="738">any device</text>
  <rect class="box" x="62" y="752" width="386" height="190" rx="12"/>
  <text class="bt" x="80" y="776">Lectio web app (React 19 + Vite)</text>
  <text class="bs" x="80" y="798">Landing · sign-in / sign-up · Google sign-in</text>
  <text class="bs" x="80" y="815">Dashboard: 5-question summary, component tabs,</text>
  <text class="bs" x="80" y="832">Security tab, live map (MapLibre, exact pins)</text>
  <text class="bs" x="80" y="849">My Devices: fixes, history, location switch</text>
  <text class="bs" x="80" y="866">Alerts window: plain words, AI diagnosis, fixes</text>
  <text class="bs" x="80" y="883">Metrics, Live, Analytics, Sensors, Help, Settings</text>
  <text class="bs" x="80" y="906">Access token in memory only · refresh cookie</text>
  <text class="bs" x="80" y="921">(HttpOnly, Secure) · strict security headers</text>

  <!-- ============ Vercel ============ -->
  <rect class="zone" x="580" y="690" width="330" height="270" rx="16"/>
  <text class="zt" x="602" y="720">Vercel</text>
  <text class="zs" x="602" y="738">getlectio.vercel.app</text>
  <rect class="box" x="602" y="752" width="286" height="88" rx="12"/>
  <text class="bt" x="620" y="776">Static site + CDN</text>
  <text class="bs" x="620" y="796">every page address → the app</text>
  <text class="bs" x="620" y="811">CSP, X-Frame-Options, nosniff,</text>
  <text class="bs" x="620" y="826">Referrer- and Permissions-Policy</text>
  <rect class="green" x="602" y="852" width="286" height="90" rx="12"/>
  <text class="bt" x="620" y="876">/api/* rewrite (proxy)</text>
  <text class="bs" x="620" y="896">makes the sign-in cookie first-party;</text>
  <text class="bs" x="620" y="911">adds X-Vercel-Forwarded-For (the</text>
  <text class="bs" x="620" y="926">visitor's real address)</text>

  <!-- ============ Render ============ -->
  <rect class="zone" x="580" y="100" width="560" height="560" rx="16"/>
  <text class="zt" x="602" y="130">Render (Docker) behind Cloudflare</text>
  <text class="zs" x="602" y="148">telemetry-engine-w57g.onrender.com · APP_ENV=production</text>
  <rect class="dark" x="602" y="164" width="516" height="476" rx="12"/>
  <text class="wt" x="620" y="190">Lectio API — FastAPI on uvicorn (Python 3.14)</text>
  <text class="ws" x="620" y="208">52 REST endpoints · 3 WebSocket streams · startup safety checks</text>
  <g>
    <rect x="620" y="222" width="236" height="74" rx="8" fill="#232327"/>
    <text class="wt" x="632" y="244" font-size="12.5">Auth</text>
    <text class="ws" x="632" y="262">JWT access + refresh cookie, email</text>
    <text class="ws" x="632" y="276">codes, Google OAuth, audit log</text>
    <rect x="866" y="222" width="234" height="74" rx="8" fill="#232327"/>
    <text class="wt" x="878" y="244" font-size="12.5">Ingest</text>
    <text class="ws" x="878" y="262">device keys, batches, queue +</text>
    <text class="ws" x="878" y="276">workers, rollups, dedup</text>
    <rect x="620" y="306" width="236" height="74" rx="8" fill="#232327"/>
    <text class="wt" x="632" y="328" font-size="12.5">Anomaly engine</text>
    <text class="ws" x="632" y="346">58 rules (hardware, memory, disk,</text>
    <text class="ws" x="632" y="360">security) with duration + clear-down</text>
    <rect x="866" y="306" width="234" height="74" rx="8" fill="#232327"/>
    <text class="wt" x="878" y="328" font-size="12.5">Alerts &amp; notifications</text>
    <text class="ws" x="878" y="346">email, webhook, live feed,</text>
    <text class="ws" x="878" y="360">PC notification hand-out</text>
    <rect x="620" y="390" width="236" height="74" rx="8" fill="#232327"/>
    <text class="wt" x="632" y="412" font-size="12.5">Diagnosis &amp; fixes</text>
    <text class="ws" x="632" y="430">Gemini or rule-based diagnosis;</text>
    <text class="ws" x="632" y="444">fix catalogue, queue, undo, audit</text>
    <rect x="866" y="390" width="234" height="74" rx="8" fill="#232327"/>
    <text class="wt" x="878" y="412" font-size="12.5">Location</text>
    <text class="ws" x="878" y="430">opt-in, owner-only; IP fallback</text>
    <text class="ws" x="878" y="444">from local DB-IP database</text>
    <rect x="620" y="474" width="480" height="68" rx="8" fill="#232327"/>
    <text class="wt" x="632" y="496" font-size="12.5">Cross-cutting</text>
    <text class="ws" x="632" y="514">Rate limits (visitor + connection address) · CORS · security headers ·</text>
    <text class="ws" x="632" y="528">cache · connection pool · slow-query and pool monitoring · health endpoint</text>
    <rect x="620" y="552" width="480" height="70" rx="8" fill="#1c7a2e"/>
    <text class="wt" x="632" y="574" font-size="12.5">Bundled in the image</text>
    <text class="ws" x="632" y="592" fill="#eaf5ec">DB-IP City Lite database (downloaded at build, CC BY 4.0) ·</text>
    <text class="ws" x="632" y="606" fill="#eaf5ec">no outside service sees PCs' internet addresses</text>
  </g>

  <!-- ============ Data ============ -->
  <rect class="zone" x="1220" y="100" width="340" height="380" rx="16"/>
  <text class="zt" x="1242" y="130">Data</text>
  <rect class="box" x="1242" y="146" width="296" height="196" rx="12"/>
  <text class="bt" x="1260" y="170">MongoDB Atlas (Beanie ODM)</text>
  <text class="bs" x="1260" y="190">users · devices (+ security, location)</text>
  <text class="bs" x="1260" y="206">telemetry_snapshots — raw, 7-day TTL</text>
  <text class="bs" x="1260" y="222">telemetry_rollups — hourly 90 d, daily 2 y</text>
  <text class="bs" x="1260" y="238">anomaly_alerts · fix_requests</text>
  <text class="bs" x="1260" y="254">device_locations — 30-day TTL</text>
  <text class="bs" x="1260" y="270">audit_logs · refresh_tokens</text>
  <text class="bs" x="1260" y="286">email_verifications · password_resets</text>
  <text class="bs" x="1260" y="310">TLS · zlib compression · retryable</text>
  <text class="bs" x="1260" y="325">reads/writes · indexes migrated on start</text>
  <rect class="box" x="1242" y="356" width="296" height="104" rx="12"/>
  <text class="bt" x="1260" y="380">Upstash Redis (rediss://)</text>
  <text class="bs" x="1260" y="400">shared rate-limit buckets (Lua)</text>
  <text class="bs" x="1260" y="416">cache: users, devices, latest reading</text>
  <text class="bs" x="1260" y="432">pub/sub relay for live updates</text>
  <text class="bs" x="1260" y="448">falls back to memory if unreachable</text>

  <!-- ============ External ============ -->
  <rect class="zone" x="1220" y="510" width="340" height="450" rx="16"/>
  <text class="zt" x="1242" y="540">External services</text>
  <rect class="ext" x="1242" y="556" width="296" height="52" rx="10"/>
  <text class="bt" x="1260" y="578">Google Gemini API</text>
  <text class="bs" x="1260" y="596">AI diagnosis and fix advice</text>
  <rect class="ext" x="1242" y="618" width="296" height="52" rx="10"/>
  <text class="bt" x="1260" y="640">SendLiberty → Gmail</text>
  <text class="bs" x="1260" y="658">verification, reset and alert emails</text>
  <rect class="ext" x="1242" y="680" width="296" height="52" rx="10"/>
  <text class="bt" x="1260" y="702">Google OAuth</text>
  <text class="bs" x="1260" y="720">“Continue with Google”</text>
  <rect class="ext" x="1242" y="742" width="296" height="52" rx="10"/>
  <text class="bt" x="1260" y="764">GitHub Releases</text>
  <text class="bs" x="1260" y="782">lectio-agent.exe download (latest)</text>
  <rect class="ext" x="1242" y="804" width="296" height="52" rx="10"/>
  <text class="bt" x="1260" y="826">OpenFreeMap</text>
  <text class="bs" x="1260" y="844">map tiles for the dashboard map</text>
  <rect class="ext" x="1242" y="866" width="296" height="52" rx="10"/>
  <text class="bt" x="1260" y="888">GitHub Actions</text>
  <text class="bs" x="1260" y="906">pytest on every push; Render + Vercel deploy main</text>

  <!-- ============ Arrows ============ -->
  <!-- agent → API -->
  <path class="lg" d="M448,250 C520,250 540,250 602,250"/>
  <text class="lbl" x="476" y="236">HTTPS + device key</text>
  <text class="lbs" x="476" y="268">readings, security,</text>
  <text class="lbs" x="476" y="281">fix results, location</text>
  <path class="ln" d="M602,330 C540,330 520,330 448,330"/>
  <text class="lbs" x="476" y="348">fixes, notifications,</text>
  <text class="lbs" x="476" y="361">location on/off</text>

  <!-- browser → vercel -->
  <path class="lg" d="M448,850 L602,850"/>
  <text class="lbl" x="470" y="838">HTTPS</text>
  <text class="lbs" x="470" y="870">pages + /api/*</text>
  <!-- vercel proxy → render -->
  <path class="lg" d="M888,897 L940,897 L940,660"/>
  <text class="lbl" x="948" y="690">/api/* proxied</text>
  <text class="lbs" x="948" y="704">to the API</text>
  <!-- browser ↔ render websocket -->
  <path class="ln" d="M448,770 C520,770 560,700 640,640"/>
  <text class="lbl" x="476" y="674">WSS live readings</text>
  <text class="lbs" x="476" y="687">+ alert feed, direct</text>

  <!-- API ↔ data -->
  <path class="lg" d="M1118,244 L1242,244"/>
  <text class="lbl" x="1128" y="234">MongoDB TLS</text>
  <path class="ln" d="M1118,408 L1242,408"/>
  <text class="lbl" x="1128" y="398">Redis TLS</text>

  <!-- API → external -->
  <path class="ld" d="M1118,560 C1180,560 1190,582 1242,582"/>
  <path class="ld" d="M1118,600 C1180,600 1190,644 1242,644"/>
  <path class="ld" d="M1118,620 C1170,640 1190,706 1242,706"/>
  <!-- browser → external -->
  <path class="ld" d="M448,930 L540,930 L540,988 L1200,988 L1200,768 L1242,768"/>
  <text class="lbs" x="930" y="982">download agent · map tiles · Google sign-in</text>

  <!-- legend -->
  <g transform="translate(40,995)">
    <path class="lg" d="M0,0 L36,0"/><text class="lbs" x="44" y="4">main data path</text>
    <path class="ln" d="M150,0 L186,0"/><text class="lbs" x="194" y="4">control / live</text>
    <path class="ld" d="M300,0 L336,0"/><text class="lbs" x="344" y="4">external service</text>
  </g>
</svg>
