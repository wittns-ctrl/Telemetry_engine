<!DOCTYPE html>
<html>
<head>
    <title>Telemetry Alert Dashboard</title>
</head>

<body>
    <h1>⚡ Live Telemetry Alerts Stream</h1>

    <p id="status">Connecting to WebSocket...</p>

    <div id="alerts"></div>

    <script>
        const websocket = new WebSocket("ws://localhost:8000/ws/alerts");

        websocket.onopen = function () {
            document.getElementById("status").textContent =
                "STATUS: Connected to Alert Stream.";
        };

        websocket.onmessage = function (event) {
            try {
                const data = JSON.parse(event.data);
                if (data.severity && data.message) {
                    const alertBox = document.createElement("div");
                    alertBox.style.padding = "12px";
                    alertBox.style.marginBottom = "8px";
                    alertBox.style.borderRadius = "6px";
                    alertBox.style.backgroundColor = data.severity === "CRITICAL" ? "#fee2e2" : "#fef3c7";
                    alertBox.style.border = data.severity === "CRITICAL" ? "1px solid #ef4444" : "1px solid #f59e0b";
                    alertBox.style.color = "#1f2937";

                    alertBox.innerHTML = `
                        <h3 style="margin: 0 0 4px 0; color: #b91c1c;">🚨 ${data.severity} - ${data.sensor_id || 'Alert'}</h3>
                        <p style="margin: 0; font-size: 14px;">${data.message}</p>
                        <small style="color: #6b7280;">Value: ${data.current_value}${data.unit} | Max Limit: ${data.threshold_max}${data.unit}</small>
                    `;

                    document.getElementById("alerts").prepend(alertBox);
                }
            } catch (err) {
                console.error("Error processing websocket message", err);
            }
        };

        websocket.onclose = function () {
            document.getElementById("status").textContent =
                "STATUS: Disconnected.";
        };

        websocket.onerror = function () {
            document.getElementById("status").textContent =
                "STATUS: WebSocket connection error.";
        };
    </script>
</body>
</html>
