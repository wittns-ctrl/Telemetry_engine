# Run the API with its own MongoDB:
#
#   docker compose up --build
#
# Reads secrets and settings from .env (copy .env.example). MONGODB_URI and
# MONGO_DB from .env are overridden here so the API talks to the bundled
# database; drop the `mongo` service and those two lines to use Atlas instead.

services:
  api:
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGO_DB: lectio
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
