# Load balancer in front of the API containers (docker-compose.yml).
# Requests are spread across them; WebSockets (live dashboards) are passed
# through with the Upgrade headers. Any container can serve any request,
# because shared state lives in Redis.

upstream lectio_api {
    # Docker's DNS returns every "api" replica; nginx re-resolves on reload.
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8000;
    client_max_body_size 2m;

    location / {
        proxy_pass http://lectio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Live dashboards keep their socket open for a long time.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
