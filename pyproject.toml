[project]
name = "telemetry-engine"
version = "0.1.0"
requires-python = ">=3.14"
# Server (API) dependencies. These must install on Linux hosts.
dependencies = [
    "beanie>=2.2.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.3.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "pymongo>=4.17.0",
]

[project.optional-dependencies]
# Host agent that runs on monitored machines: `uv sync --extra agent`
agent = [
    "psutil>=7.2.2",
    "wmi>=1.5.1; sys_platform == 'win32'",
    "pywin32>=312; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mongomock-motor>=0.0.36",
    "motor>=3.7.1",
]
