name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Settings needs these to load. The tests use an in-memory MongoDB
    # (mongomock), so nothing connects to this URI, and the key only signs
    # test tokens. Real alert emails and webhooks are switched off by
    # tests/conftest.py.
    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGO_DB: lectio_ci
      SECRET_KEY: ci-only-signing-key-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.14"
          enable-cache: true

      # Dev group (pytest, mongomock) plus the agent extra: the sensor service
      # tests import psutil. The Windows-only WMI packages are skipped on Linux.
      - name: Install dependencies
        run: uv sync --locked --extra agent

      # -v logs each test's name as it runs, so a hang shows which test it is.
      # faulthandler_timeout prints every thread's traceback for any test still
      # running after 120 s (the whole suite takes about 2 minutes).
      # --durations lists the slowest tests.
      - name: Run tests
        timeout-minutes: 10
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"  # so the log keeps every line even if the step is killed
        run: |
          set -o pipefail
          uv run --no-sync pytest -v -rfE -o faulthandler_timeout=120 --durations=15 2>&1 | tee pytest.log

      # Job logs need a GitHub sign-in to read; the run summary and annotations
      # don't. On a failure or timeout, put where pytest stopped in both.
      - name: Report where the tests stopped
        if: failure() || cancelled()
        shell: bash
        run: |
          {
            echo "## Last 80 lines of pytest output"
            echo '```'
            tail -n 80 pytest.log 2>/dev/null || echo "(no pytest output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          last=$(grep -E '^(tests/|test_)[^ ]*::' pytest.log 2>/dev/null | tail -n 1)
          echo "::error title=Last test pytest reached::${last:-none}"
          # One annotation per failed or erroring test, from pytest's -rfE
          # short summary ("FAILED tests/x.py::test_y - message").
          # GitHub shows up to 10 error annotations per step.
          grep -E '^(FAILED|ERROR) ' pytest.log 2>/dev/null | head -n 9 | while IFS= read -r line; do
            echo "::error title=${line%% *}::${line#* }"
          done
