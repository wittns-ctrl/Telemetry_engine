<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lectio page options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #dcdcd8; font-family: "Inter", system-ui, sans-serif; color: #0e0e10; -webkit-font-smoothing: antialiased; }
  .pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 auto 18px; width: fit-content; font-size: 13px; font-weight: 600; }
  .pick button { height: 30px; padding: 0 14px; border: 1px solid #8e8e96; border-radius: 999px; background: #fff; font: inherit; cursor: pointer; }
  .pick button.on { background: #0e0e10; border-color: #0e0e10; color: #fff; }
  .opt { margin: 0 auto 34px; width: fit-content; }
  .opt-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 10px 2px; }
  .opt-head h2 { margin: 0; font-size: 19px; font-weight: 700; }
  .opt-head p { margin: 0; font-size: 13px; color: #45454c; }

  /* Everything inside .frame is in reference pixels (640 wide), zoomed up. */
  .frame { position: relative; display: flow-root; width: 640px; min-height: 403px; border-radius: 10px; overflow: hidden; background: #0e0e10; zoom: var(--zoom, 2); }
  .frame svg { display: block; flex: none; }
  .rail { position: absolute; left: 0; top: 0; width: 125px; height: 403px; padding: 18px 8px 14px; display: flex; flex-direction: column; color: #d9d9dc; }
  .brand { display: flex; align-items: center; gap: 6px; padding-left: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: -.01em; color: #fff; }
  .cap { margin: 20px 0 7px 5px; font-size: 4.2px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #8e8e96; }
  .nav { display: flex; flex-direction: column; gap: 3px; }
  .nav a { display: flex; align-items: center; gap: 7px; height: 22px; padding: 0 5px; border-radius: 8px; font-size: 6.2px; font-weight: 500; }
  .nav a span { display: grid; place-items: center; width: 14px; height: 14px; border-radius: 4.5px; background: rgba(255,255,255,.08); }
  .nav a svg { width: 7.5px; height: 7.5px; }
  .nav a.on { background: #232327; color: #fff; font-weight: 600; }
  .nav a.on span { background: #5cc061; color: #0e0e10; }
  .acct { margin-top: auto; }
  .acct .cap { margin-top: 0; }
  .who { display: flex; align-items: center; gap: 6px; padding-left: 4px; }
  .ava { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: #dcefe0; color: #176b22; font-size: 6.5px; font-weight: 700; flex: none; }
  .who b { display: block; font-size: 6.2px; font-weight: 600; color: #fff; }
  .who small { display: block; margin-top: 1px; font-size: 4.8px; color: #8e8e96; }

  .panel { font-size: 5.4px; line-height: 1.3; margin: 8px 5px 8px 125px; min-height: 387px; padding: 15px 10px 10px 12px; border-radius: 12px; background: #f4f4f2; display: flex; flex-direction: column; gap: 9px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
  .title { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -.02em; }
  .tools { display: flex; gap: 5px; }
  .search { display: flex; align-items: center; gap: 5px; width: 132px; height: 20px; padding: 0 8px; border-radius: 999px; background: #fff; border: .5px solid #e9e9e6; font-size: 5.4px; color: #8e8e96; }
  .search svg { width: 7px; height: 7px; color: #45454c; }
  .bell { position: relative; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #0e0e10; color: #fff; }
  .bell svg { width: 8px; height: 8px; }
  .bell i { position: absolute; right: 5px; top: 5px; width: 3.5px; height: 3.5px; border-radius: 50%; background: #ec003f; box-shadow: 0 0 0 1px #0e0e10; }

  /* building blocks */
  .card { border-radius: 8px; background: #fff; min-width: 0; }
  .pad { padding: 10px; }
  .dk { background: #0e0e10; color: #fff; }
  .gs { background: #dcefe0; }
  .row { display: flex; gap: 8px; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .ac { align-items: center; }
  .f1 { flex: 1; min-width: 0; }
  .r { margin-left: auto; }
  .g2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .h { display: flex; align-items: center; gap: 5px; font-size: 6.6px; font-weight: 600; }
  .h > svg { width: 8px; height: 8px; color: #1c7a2e; }
  .dk .h > svg { color: #5cc061; }
  .t7 { display: block; font-size: 7px; font-weight: 600; }
  .t9 { display: block; font-size: 9.5px; font-weight: 600; letter-spacing: -.01em; }
  .sub { font-size: 4.8px; font-weight: 400; color: #8e8e96; }
  .p { margin: 0; font-size: 5px; line-height: 1.6; color: #5f5f68; }
  .dk .p, .dk .sub { color: #b9b9bf; }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  .vd { display: inline-grid; place-items: center; height: 11.5px; padding: 0 6px; border-radius: 3.5px; border: .6px solid #8e8e96; font-size: 4.5px; font-weight: 600; white-space: nowrap; }
  .btn { margin: 8px 3px 0; display: grid; place-items: center; height: 15px; border-radius: 4px; border: .6px solid #45454c; font-size: 5px; font-weight: 600; }
  .bk { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 18px; padding: 0 9px; border-radius: 5px; background: #0e0e10; color: #fff; font-size: 5.2px; font-weight: 600; white-space: nowrap; }
  .bk svg { width: 7px; height: 7px; }
  .bk.gr { background: #1c7a2e; }
  .bk.rs { background: #c70036; }
  .chip { display: inline-flex; align-items: center; gap: 2.5px; padding: 2px 5px; border-radius: 99px; background: #eaf5ec; font-size: 4.4px; font-weight: 600; color: #176b22; white-space: nowrap; }
  .chip.w { background: #fff1f2; color: #c70036; }
  .chip.n { background: #f5f5f6; color: #45454c; }
  .chip.o { background: #fff; border: .5px solid #d9d9dc; color: #45454c; font-weight: 500; }
  .chip.k { background: #0e0e10; color: #fff; }
  .ico { display: grid; place-items: center; width: 17px; height: 17px; border-radius: 5.5px; background: #f5f5f6; flex: none; }
  .ico svg { width: 8.5px; height: 8.5px; }
  .ico.g { background: #dcefe0; color: #176b22; }
  .ico.k { background: #0e0e10; color: #fff; }
  .ico.w { background: #fff1f2; color: #c70036; }
  .ico.d { background: #232327; color: #5cc061; }
  .bar { height: 4px; border-radius: 99px; background: #ebebed; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: #1c7a2e; }
  .li { display: flex; align-items: center; gap: 7px; padding: 6px 0; border-top: .5px solid #f0f0ee; font-size: 5.4px; font-weight: 500; }
  .li:first-of-type { border-top: 0; }
  .li > svg { width: 8px; height: 8px; }
  .li small { display: block; margin-top: 1.5px; font-size: 4.6px; font-weight: 400; color: #8e8e96; }
  .dk .li { border-color: #232327; }
  .tb { width: 100%; border-collapse: collapse; font-size: 5px; }
  .tb th { padding: 4px 6px; border-bottom: .5px solid #ebebed; text-align: left; font-size: 4.4px; font-weight: 500; color: #8e8e96; }
  .tb td { padding: 5.5px 6px; border-bottom: .5px solid #f5f5f6; white-space: nowrap; }
  .fld label { display: block; margin-bottom: 2.5px; font-size: 4.6px; font-weight: 500; color: #5f5f68; }
  .fld div { display: flex; align-items: center; height: 17px; padding: 0 6px; border: .6px solid #d9d9dc; border-radius: 5px; font-size: 5.2px; }
  .fld.off div { background: #f5f5f6; color: #8e8e96; }
  .code { margin: 0; padding: 8px; border-radius: 6px; background: #0e0e10; color: #d9d9dc; font-family: ui-monospace, Consolas, monospace; font-size: 4.5px; line-height: 1.75; white-space: pre; overflow: hidden; }
  .dk .code { background: #1c1c1f; }
  .code b { color: #5cc061; font-weight: 400; }
  .sl label { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 4.8px; font-weight: 500; }
  .sl label b { font-weight: 600; color: #176b22; }
  .sl div { position: relative; height: 3px; border-radius: 99px; background: #ebebed; }
  .sl div i { position: absolute; left: 0; top: 0; height: 100%; border-radius: 99px; background: #1c7a2e; }
  .sl div u { position: absolute; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 1.6px solid #1c7a2e; transform: translate(-50%, -50%); }
  .sl p { display: flex; justify-content: space-between; margin: 4px 0 0; font-size: 4.2px; color: #8e8e96; }
  .mini { padding: 5px 6px; border-radius: 5px; background: #f5f5f6; }
  .mini > span:not(.ico) { display: block; font-size: 4.4px; color: #5f5f68; }
  .mini b { display: block; margin-top: 2px; font-size: 8px; font-weight: 600; }
  .mini small { display: block; margin-top: 1.5px; font-size: 4.4px; color: #8e8e96; }
  .dash svg { width: 9px; height: 9px; }
  .dash { display: grid; place-items: center; gap: 5px; align-content: center; border: .8px dashed #8e8e96; border-radius: 8px; font-size: 5.4px; font-weight: 600; color: #45454c; }

  /* reference pieces */
  .stat { padding: 9px 10px; display: flex; justify-content: space-between; }
  .stat h3 { margin: 0; font-size: 5.2px; font-weight: 500; color: #5f5f68; }
  .v { margin-top: 5px; font-size: 13px; font-weight: 600; letter-spacing: -.02em; }
  .v small { font-size: 8px; font-weight: 500; color: #5f5f68; letter-spacing: 0; }
  .stat .d { margin-top: 5px; font-size: 4.5px; color: #8e8e96; }
  .stat .d b { font-weight: 600; color: var(--tone, #1c7a2e); }
  .stat .vd { margin-top: 6px; }
  .bars { display: flex; align-items: flex-end; gap: 2.5px; height: 24px; margin-top: 6px; }
  .bars i { width: 4px; border-radius: 1.2px; background: var(--tone, #1c7a2e); }
  .bars i:nth-child(even) { background: var(--tone-soft, #b5dfbe); }
  .gmid { display: grid; grid-template-columns: 116px 120px 1fr; gap: 8px; }
  .r2 { padding: 11px 10px 9px; display: flex; flex-direction: column; }
  .r2 h3 { margin: 0; font-size: 6.6px; font-weight: 600; text-align: center; }
  .big { margin-top: 10px; text-align: center; font-size: 25px; font-weight: 500; letter-spacing: -.03em; line-height: 1; }
  .big small { font-size: 15px; color: #5f5f68; letter-spacing: 0; }
  .gauge { margin: 8px auto 0; width: 80px; }
  .foot { margin: 5px 0 7px; text-align: center; font-size: 4.5px; color: #5f5f68; }
  .foot b { color: #0e0e10; }
  .rows { margin: 11px 3px 0; display: grid; gap: 6px; }
  .rows div { display: flex; align-items: center; gap: 5px; font-size: 5.2px; font-weight: 500; }
  .rows i { width: 4px; height: 4px; border-radius: 50%; background: #1c7a2e; }
  .rows em { margin-left: auto; font-style: normal; font-weight: 400; color: #8e8e96; }
  .r2 .btn { margin-top: auto; }
  .chart { padding: 10px 10px 5px; display: flex; flex-direction: column; }
  .seg { margin-left: auto; display: flex; padding: 1px; border-radius: 99px; background: #f5f5f6; }
  .seg em { font-style: normal; font-size: 4.4px; font-weight: 500; padding: 2.2px 5.5px; border-radius: 99px; color: #5f5f68; }
  .seg em.on { background: #0e0e10; color: #fff; }
  .ch-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 5px 8px; margin-top: 7px; }
  .tabs { display: flex; gap: 3px; }
  .tabs em { display: flex; align-items: center; gap: 2.5px; font-style: normal; font-size: 4.4px; font-weight: 500; padding: 2.4px 5px; border-radius: 99px; border: .5px solid #d9d9dc; color: #45454c; white-space: nowrap; }
  .tabs em i { width: 3.5px; height: 3.5px; border-radius: 50%; }
  .tabs em.on { border-color: #1c7a2e; background: #eaf5ec; color: #176b22; font-weight: 600; }
  .st { display: flex; gap: 7px; font-size: 4.4px; color: #8e8e96; }
  .st b { font-weight: 600; color: #0e0e10; }
  .ch-plot { flex: 1; min-height: 58px; display: grid; grid-template-columns: 16px 1fr; grid-template-rows: 1fr 10px; margin-top: 8px; }
  .ch-y, .ch-area, .ch-x { position: relative; }
  .ch-y span { position: absolute; right: 4px; transform: translateY(-50%); font-size: 4px; color: #8e8e96; white-space: nowrap; }
  .ch-area svg, .spark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .gl { position: absolute; left: 0; right: 0; height: .5px; background: #ebebed; }
  .lim { position: absolute; left: 0; right: 0; border-top: .7px dashed #ec003f; }
  .lim span { position: absolute; right: 0; bottom: 1.5px; padding: 1px 3.5px; border-radius: 99px; background: #fff1f2; font-size: 3.8px; font-weight: 500; color: #c70036; }
  .ch-x { grid-column: 2; }
  .ch-x span { position: absolute; top: 3.5px; transform: translateX(-50%); font-size: 4px; color: #8e8e96; white-space: nowrap; }
  .ch-x span:first-child { transform: none; }
  .ch-x span:last-child { transform: translateX(-100%); }
  .spark { position: relative; height: 34px; margin-top: 6px; }
  .glow { display: grid; grid-template-columns: 240px 1fr; gap: 7px; }
  .pills { display: grid; gap: 9px; }
  .pill { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px 0 12px; border-radius: 999px; }
  .pill b { display: block; font-size: 7.4px; font-weight: 600; }
  .pill small { display: block; margin-top: 4px; font-size: 5px; }
  .pill > .vd, .pill > .bk, .pill > .chip { margin-left: auto; }
  .pill.dark { background: #0e0e10; color: #fff; }
  .pill.dark small { color: #b9b9bf; }
  .pill.soft { background: #dcefe0; }
  .pill.soft small { color: #5f5f68; }
  .pill.soft .vd { border-color: #1c7a2e; color: #176b22; }
  .pill.white { background: #fff; }
  .pill.white small { color: #5f5f68; }
  .ring { position: relative; width: 32px; height: 32px; flex: none; }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 5.8px; font-weight: 600; }
  .ring span svg { width: 10px; height: 10px; }
  .promo { position: relative; min-height: 109px; border-radius: 12px; overflow: hidden; background: #176b22; color: #fff; }
  .promo > * { position: absolute; }
  .promo .pb { left: 12px; top: 11px; display: flex; align-items: center; gap: 4px; font-size: 6.4px; font-weight: 600; }
  .promo h3 { left: 12px; top: 36px; margin: 0; font-size: 10.6px; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
  .promo .ppl { left: 12px; bottom: 9px; display: flex; align-items: center; gap: 5px; font-size: 5.4px; font-weight: 500; }
  .promo .go { right: 12px; top: 10px; width: 15px; height: 15px; }
  .promo .art { right: 0; bottom: 0; width: 135px; height: 110px; }
  .promo .find { left: 12px; bottom: 12px; display: flex; align-items: center; gap: 5px; width: 190px; height: 20px; padding: 0 8px; border-radius: 99px; background: #fff; font-size: 5.2px; color: #8e8e96; }
  .promo .find svg { width: 7px; height: 7px; color: #45454c; }
  .tag { padding: 3.5px 6px; border-radius: 4px; font-size: 4.4px; font-weight: 600; }
  .tag.a { right: 62px; bottom: 42px; background: #5cc061; color: #0e0e10; transform: rotate(-5deg); }
  .tag.b { right: 70px; bottom: 26px; background: #fff; color: #0e0e10; transform: rotate(4deg); }
  .ctabs { display: flex; gap: 4px; }
  .ctabs em { display: flex; align-items: center; gap: 4px; height: 17px; padding: 0 9px; border-radius: 99px; background: #fff; font-style: normal; font-size: 5.6px; font-weight: 500; color: #45454c; white-space: nowrap; }
  .ctabs em svg { width: 7px; height: 7px; }
  .ctabs em.on { background: #0e0e10; color: #fff; font-weight: 600; }
  .ctabs em b { font-weight: 500; color: #8e8e96; }
  .dotg, .doto { width: 4px; height: 4px; border-radius: 50%; background: #5cc061; flex: none; }
  .doto { background: #b9b9bf; }
  .num { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 6px; background: #0e0e10; color: #fff; font-size: 6.4px; font-weight: 700; flex: none; }
  .stack { display: flex; height: 9px; border-radius: 99px; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
(() => {
const ic = (n) => `<i data-lucide="${n}"></i>`;
const H = (icon, title, right = "") => `<div class="h">${icon ? ic(icon) : ""}${title}${right ? `<span class="r row ac" style="gap:4px">${right}</span>` : ""}</div>`;
const chip = (t, k = "") => `<span class="chip ${k}">${t}</span>`;
const vd = (t = "View details") => `<span class="vd">${t}</span>`;
const bk = (t, i, k = "") => `<span class="bk ${k}">${i ? ic(i) : ""}${t}</span>`;
const ico = (n, k = "") => `<span class="ico ${k}">${ic(n)}</span>`;
const mark = (letter, ribbon, h) => `<svg viewBox="0 0 32.5 45" style="height:${h}px;width:auto"><path fill="${letter}" d="M0 0H13V32.5H32.5V45H0Z"/><path fill="${ribbon}" d="M19 0H32.5V25.4L25.75 20.4L19 25.4Z"/></svg>`;
const topBar = (t) => `<div class="top"><h1 class="title">${t}</h1><div class="tools"><div class="search">${ic("search")}Search devices, metrics, alerts...</div><div class="bell">${ic("bell")}<i></i></div></div></div>`;
const fld = (label, val, off) => `<div class="fld${off ? " off" : ""}"><label>${label}</label><div>${val}</div></div>`;
const slider = (label, val, lo, hi, pct) => `<div class="sl"><label>${label}<b>${val}</b></label><div><i style="width:${pct}%"></i><u style="left:${pct}%"></u></div><p><span>${lo}</span><span>${hi}</span></p></div>`;
const table = (heads, rows) => `<table class="tb"><tr>${heads.map((h) => `<th>${h}</th>`).join("")}</tr>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
const mini = (k, v, s = "") => `<div class="mini"><span>${k}</span><b>${v}</b><small>${s}</small></div>`;
const usage = (name, pct, note) => `<div><div class="row ac" style="margin-bottom:3px"><span style="font-size:5px;font-weight:500">${name}</span><span class="sub r">${note}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;

function st(label, v, u, sub, o = {}) {
  const tone = o.warn ? "--tone:#ec003f;--tone-soft:#fecdd3" : "";
  return `<article class="card stat" style="${tone}"><div><h3>${label}</h3><div class="v">${v} <small>${u}</small></div><div class="d">${sub}</div>${o.vd ? vd(o.vd === true ? undefined : o.vd) : ""}</div>
    ${o.bars ? `<div class="bars">${o.bars.map((b) => `<i style="height:${b}px"></i>`).join("")}</div>` : o.icon ? ico(o.icon, o.warn ? "w" : "g") : ""}</article>`;
}
function ring(pct, track, stroke, label, color) {
  const c = 2 * Math.PI * 13;
  return `<div class="ring"><svg viewBox="0 0 32 32" width="32" height="32"><circle cx="16" cy="16" r="13" fill="none" stroke="${track}" stroke-width="3.4"/>
    <circle cx="16" cy="16" r="13" fill="none" stroke="${stroke}" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="${c * pct} ${c}" transform="rotate(-90 16 16)"/></svg><span style="color:${color}">${label}</span></div>`;
}
const pill = (kind, pct, label, title, sub, action = vd()) => {
  const [track, stroke, col] = kind === "dark" ? ["rgba(255,255,255,.16)", "#5cc061", "#fff"] : ["#b5dfbe", "#1c7a2e", "#0e0e10"];
  return `<article class="pill ${kind}">${ring(pct, kind === "white" ? "#ebebed" : track, stroke, label, col)}<span><b>${title}</b><small>${sub}</small></span>${action}</article>`;
};
function gaugeCard(title, pct, foot) {
  const len = Math.PI * 34;
  return `<article class="card r2"><h3>${title}</h3><div class="big">${pct}<small>%</small></div>
    <svg class="gauge" viewBox="0 0 84 44"><path d="M8 42a34 34 0 0 1 68 0" fill="none" stroke="#0e0e10" stroke-width="13"/>
    <path d="M8 42a34 34 0 0 1 68 0" fill="none" stroke="#5cc061" stroke-width="13" stroke-dasharray="${len * pct / 100} ${len}"/></svg>
    <div class="foot">${foot}</div><div class="btn">View Details</div></article>`;
}
const listCard = (title, big, unit, rows) => `<article class="card r2"><h3>${title}</h3><div class="big">${big}<small>${unit}</small></div>

function wave(points, base, amp, seed, end) {
  const raw = Array.from({ length: points }, (_, i) => base + amp * Math.sin(i * 0.55 + seed) + amp * 0.45 * Math.sin(i * 1.7 + seed * 2));
  const drift = end - raw[points - 1];
  return raw.map((v, i) => Math.round(v + drift * (i / (points - 1))));
}

function lines(series) {
  return series.map(([b, a, s, e, c], k) => {
    const pts = wave(24, b, a, s, e).map((v, i) => `${(i / 23 * 1000).toFixed(1)},${(300 - v * 3).toFixed(1)}`);
    return (k ? "" : `<path d="M0,300 L${pts.join(" L")} L1000,300 Z" fill="url(#fill)"/>`) +
      `<polyline points="${pts.join(" ")}" fill="none" stroke="${c}" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  }).join("");
}

      <div class="g3">${st("Temperature readings", 67, "", "<b>52.3%</b> of all readings", { bars: [20, 10, 15, 8, 12], vd: true })}${st("CPU readings", 41, "", "<b>32.0%</b> of all readings", { bars: [9, 17, 11, 22, 14], vd: true })}${st("Network readings", 20, "", "<b>15.7%</b> of all readings", { bars: [11, 12, 16, 9, 21], vd: true })}</div>
      <div class="gmid">${gaugeCard("Within Limits", 91, "<b>12</b> readings breached a limit")}${listCard("Total Readings", 128, "", [["Temperature", "67"], ["CPU usage", "41"], ["Network", "20"]])}${chart("Readings per hour", ["All", "Temperature", "CPU", "Network"], { unit: "", seg: ["24h", "7d", "30d"], series: [[30, 12, 0.9, 42, "#1c7a2e"]] })}</div>
      <div class="glow"><div class="pills">${pill("dark", 1, ic("server"), "API Backend", "FastAPI and Beanie · responding", chip("Online"))}${pill("soft", 1, ic("database"), "Database", "MongoDB instance · connected", chip("Connected", "k"))}</div>${promo()}</div>` },
    { name: "Graph first", note: "A wide graph of readings over time leads; totals and service status follow.", body: () => `${topBar("Analytics")}
      ${chart("Readings over time", ["All", "Temperature", "CPU", "Network"], { unit: "", seg: ["24h", "7d", "30d"], series: [[30, 12, 0.9, 42, "#1c7a2e"]], style: "min-height:150px", stats: [["Total", "128"], ["Busiest hour", "2 PM"], ["Breaches", "12"]] })}
      <div class="g4">${st("All readings", 128, "", "<b>+12</b> in the last hour", { icon: "database" })}${st("Temperature", 67, "", "<b>52.3%</b> of all", { icon: "thermometer" })}${st("CPU usage", 41, "", "<b>32.0%</b> of all", { icon: "cpu" })}${st("Network", 20, "", "<b>15.7%</b> of all", { icon: "radio" })}</div>
      <div class="g2">${pill("dark", 1, ic("server"), "API Backend", "FastAPI and Beanie · responding", chip("Online"))}${pill("soft", 1, ic("database"), "Database", "MongoDB instance · connected", chip("Connected", "k"))}</div>` },
    { name: "Breakdown and health", note: "A share-of-readings breakdown and the busiest sensors on the left, engine health on the right.", body: () => {
      const share = (c, n, v, p) => `<div class="li"><i style="width:5px;height:5px;border-radius:2px;background:${c}"></i><span class="f1">${n}</span><b>${v}</b><span class="sub" style="width:26px;text-align:right">${p}</span></div>`;
      return `${topBar("Analytics")}
      <div class="row" style="flex:1"><div class="col f1"><article class="card pad">${H("chart-pie", "Readings by type", `<span class="sub">128 in total</span>`)}
          <div class="stack" style="margin:8px 0 5px"><i style="width:52.3%;background:#1c7a2e"></i><i style="width:32%;background:#5cc061"></i><i style="width:15.7%;background:#0e0e10"></i></div>
          ${share("#1c7a2e", "Temperature", 67, "52.3%")}${share("#5cc061", "CPU usage", 41, "32.0%")}${share("#0e0e10", "Network", 20, "15.7%")}</article>
          <article class="card pad f1">${H("server", "Busiest sensors", vd("View all"))}<div style="margin-top:5px">${table(["Sensor ID", "Type", "Readings", "Last seen"], SENSORS.slice(0, 4).map(([s, t, , w], i) => [`<span class="mono">${s}</span>`, chip(t, "n"), `<b>${[42, 31, 20, 14][i]}</b>`, `<span class="sub">${w}</span>`]))}</div></article></div>
        <div class="col" style="width:168px"><article class="card pad dk f1">${H("heart-pulse", "Engine health", chip("All good"))}<div style="margin-top:5px">
            ${[["server", "API backend", "FastAPI and Beanie"], ["database", "Database", "MongoDB instance"], ["radio", "Live stream", "WebSocket connected"]].map(([i, t, s]) => `<div class="li">${ico(i, "d")}<span class="f1">${t}<small>${s}</small></span><i class="dotg"></i></div>`).join("")}</div></article>
          ${pill("soft", .91, "91%", "Within limits", "12 breaches", "")}</div></div>`; } },
  ] },

  { id: "sensors", nav: 5, name: "Sensors", opts: [
    { name: "A card per sensor", note: "Totals on top, then each sensor in its own card with its latest value.", body: () => `${topBar("Sensors")}
      <div class="g3">${st("Sensors reporting", 6, "", "Among your last <b>100</b> readings", { icon: "server" })}${st("Reading types", 3, "", "<b>Temperature, CPU, Network</b>", { icon: "layers" })}${st("Latest reading", 12, "s ago", "<b>sensor_room_101</b>", { icon: "clock" })}</div>
      <div class="g3">${SENSORS.map(([s, t, v, w, i]) => `<article class="card pad"><div class="row ac" style="gap:6px">${ico(i, "g")}<span class="f1 mono" style="font-size:5.4px;font-weight:600">${s}</span></div><div class="row ac" style="margin-top:7px;align-items:flex-end"><span><span class="sub">${t}</span><b class="t9" style="margin-top:2px">${v}</b></span><span class="sub r">${w}</span></div><div class="row ac" style="margin-top:7px">${chip("Reporting")}<span class="r">${vd()}</span></div></article>`).join("")}</div>` },
    { name: "One table", note: "Every sensor as a row you can filter by type; the densest of the three.", body: () => `${topBar("Sensors")}
      <article class="card pad f1">${H("server", "Recently active sensors", `<span class="sub">6 reporting</span>${chip("All", "k")}${chip("Temperature", "o")}${chip("CPU", "o")}${chip("Network", "o")}`)}
        <div style="margin-top:6px">${table(["Sensor ID", "Type", "Latest value", "Last seen", "Status", ""], SENSORS.map(([s, t, v, w, i]) => [`<span class="row ac" style="gap:6px">${ico(i, "g")}<span class="mono" style="font-weight:600">${s}</span></span>`, chip(t, "n"), `<b>${v}</b>`, `<span class="sub">${w}</span>`, chip("Reporting"), vd()]))}</div></article>` },
    { name: "Grouped by reading type", note: "Three columns (Temperature, CPU, Network), each listing its sensors as pills.", body: () => `${topBar("Sensors")}
      <div class="row ac"><span class="sub" style="font-size:5.4px">6 sensors reported among your 100 most recent readings</span><span class="r">${vd("Refresh")}</span></div>
      <div class="g3" style="flex:1">${[["thermometer", "Temperature"], ["cpu", "CPU"], ["radio", "Network"]].map(([i, t]) => `<article class="card pad col" style="gap:7px">${H(i, t, chip("2 sensors", "n"))}
        ${SENSORS.filter((s) => s[1] === t).map(([s, , v, w], k) => `<div class="pill ${k ? "white" : "soft"}" style="height:44px;gap:7px;padding:0 10px;${k ? "box-shadow:inset 0 0 0 .6px #d9d9dc" : ""}">${ico("radio", k ? "" : "k")}<span><b class="mono" style="font-size:5.2px">${s}</b><small style="margin-top:2.5px">${w}</small></span><b class="r" style="font-size:7px">${v}</b></div>`).join("")}
        <span class="vd" style="margin-top:auto">View details</span></article>`).join("")}</div>` },
  ] },

  { id: "settings", nav: 6, name: "Settings", opts: [
    { name: "Profile card beside the forms", note: "A black profile card on the left; name, password and delete account stacked on the right.", body: () => `${topBar("Settings")}
      <div class="row" style="flex:1"><article class="card pad dk col" style="width:140px;align-items:flex-start"><span class="ava" style="width:38px;height:38px;border-radius:11px;font-size:12px">MW</span><span><b class="t9">Mugisha Witness</b><span class="sub">name@example.com</span></span>${chip("Email verified")}
          <div style="align-self:stretch;margin-top:auto">${[["Member since", "12 Mar 2026"], ["Last sign-in", "Today, 09:24"], ["Role", "Owner"]].map(([k, v]) => `<div class="li"><span class="f1 sub">${k}</span>${v}</div>`).join("")}</div></article>
        <div class="col f1"><article class="card pad col">${H("user", "Personal information")}<div class="g2">${fld("Full name", "Mugisha Witness")}${fld("Email (can't be changed here)", "name@example.com", 1)}</div><div>${bk("Save changes")}</div></article>
          <article class="card pad col">${H("lock", "Login and password", `<span class="sub">Secure your account</span>`)}<div class="g3">${fld("Current password", "••••••••")}${fld("New password", "Enter new password")}${fld("Confirm", "Confirm new password")}</div><div>${bk("Update password")}</div></article>
          <article class="card pad row ac" style="box-shadow:inset 0 0 0 .6px #fecdd3">${ico("trash-2", "w")}<span class="f1"><b class="t7">Delete account</b><span class="sub">Permanently removes your account, devices and readings.</span></span>${bk("Delete account", "", "rs")}</article></div></div>` },
    { name: "Three tabs", note: "Profile, Password and Delete account each get their own tab. Shown on Profile.", body: () => `${topBar("Settings")}
      <div class="ctabs"><em class="on">${ic("user")}Profile</em><em>${ic("lock")}Password</em><em>${ic("trash-2")}Delete account</em></div>
      <div class="g3">${st("Member since", "12 Mar", "2026", "<b>8 months</b> with Lectio", { icon: "calendar" })}${st("Last sign-in", "09:24", "today", "<b>This device</b>", { icon: "clock" })}${st("Role", "Owner", "", "<b>Full access</b> to this account", { icon: "shield-check" })}</div>
      <article class="card pad col f1" style="gap:10px"><div class="row ac" style="gap:8px"><span class="ava" style="width:34px;height:34px;border-radius:10px;font-size:11px">MW</span><span><b class="t9">Mugisha Witness</b><span class="sub">name@example.com</span></span><span class="r">${chip("Email verified")}</span></div>
        ${H("user", "Personal information")}<div class="g2">${fld("Full name", "Mugisha Witness")}${fld("Email (can't be changed here)", "name@example.com", 1)}</div><div style="margin-top:auto">${bk("Save changes")}</div></article>` },
    { name: "Labelled sections", note: "One column: each section's title and explanation on the left, its form on the right.", body: () => {
      const sec = (t, s, inner) => `<div class="row"><div style="width:120px;padding-top:4px"><b class="t7">${t}</b><p class="p" style="margin-top:3px">${s}</p></div><article class="card pad col f1">${inner}</article></div>`;
      return `${topBar("Settings")}
      ${sec("Personal information", "The name shown across Lectio. Member since 12 Mar 2026 · Role: Owner.", `<div class="g2">${fld("Full name", "Mugisha Witness")}${fld("Email (can't be changed here)", "name@example.com", 1)}</div><div class="row ac">${bk("Save changes")}<span class="sub">Last sign-in today, 09:24</span></div>`)}
      ${sec("Login and password", "Changing your password signs you out of every session.", `<div class="g3">${fld("Current password", "••••••••")}${fld("New password", "Enter new password")}${fld("Confirm", "Confirm new password")}</div><div>${bk("Update password")}</div>`)}
      ${sec("Delete account", "Permanent. Your devices, readings and alerts are removed.", `<div class="row ac">${ico("trash-2", "w")}<span class="f1 sub">Type DELETE to confirm, then delete your account.</span>${bk("Delete account", "", "rs")}</div>`)}`; } },
  ] },

  { id: "help", nav: 7, name: "Help", opts: [
    { name: "Topic cards with the agent command", note: "Four topic cards on the left; the agent command and the alerts note stay visible on the right.", body: () => `${topBar("Help")}
      <div class="row" style="flex:1"><div class="g2 f1">${TOPICS.map(([i, t, b, a]) => `<article class="card pad col" style="gap:6px">${ico(i, "g")}<b class="t7">${t}</b><p class="p f1">${b}</p><div>${vd(a)}</div></article>`).join("")}</div>
        <div class="col" style="width:172px"><article class="card pad col dk">${H("terminal", "Starting the agent")}<p class="p">Run this on the computer you want to monitor:</p><pre class="code">${AGENT}</pre><p class="p">Your password is used once to register and is not stored.</p></article>
          <article class="card pad col gs f1">${H("triangle-alert", "When do alerts fire?")}<p class="p" style="color:#45454c">${ALERT_FAQ}</p></article></div></div>` },
    { name: "Numbered steps", note: "Reads as a getting-started guide: four steps across, then the command and the alerts note.", body: () => `${topBar("Help")}
      <div class="g4">${TOPICS.map(([i, t, b, a], k) => `<article class="card pad col" style="gap:6px"><div class="row ac"><span class="num">${k + 1}</span><span class="r">${ico(i, "g")}</span></div><b class="t7">${t}</b><p class="p f1">${b}</p><div>${vd(a)}</div></article>`).join("")}</div>
      <div class="row" style="flex:1"><article class="card pad col dk f1">${H("terminal", "Starting the agent", chip("Run once per PC"))}<p class="p">From the project folder on the computer you want to monitor, run:</p><pre class="code">${AGENT}</pre><p class="p">The agent asks for your email and password the first time only.</p></article>
        <article class="card pad col gs" style="width:190px">${H("triangle-alert", "When do alerts fire?")}<p class="p" style="color:#45454c">${ALERT_FAQ}</p><div style="margin-top:auto">${bk("Open Live Monitor")}</div></article></div>` },
    { name: "Search banner and questions", note: "A green help banner with search on top, then questions that open one at a time.", body: () => `${topBar("Help")}
      <article class="promo" style="min-height:92px">${promoArt}<div class="pb">${mark("#fff", "#5cc061", 8)}Lectio Help</div><h3 style="top:30px">How can we help?</h3><div class="find">${ic("search")}Search help: agent, alerts, password...</div></article>
      <article class="card pad f1"><div class="li"><span class="f1"><b class="t7">How do I start the agent?</b></span>${ic("chevron-up")}</div><p class="p" style="margin:0 0 6px">From the project folder on the computer you want to monitor, run:</p><pre class="code">${AGENT}</pre>
        ${[...TOPICS.map((t) => t[1]), "When do alerts fire?"].map((t) => `<div class="li"><span class="f1"><b class="t7" style="font-weight:500">${t}</b></span>${ic("chevron-down")}</div>`).join("")}</article>` },
  ] },
];

function frame(p, o, k) {
  const nav = [["layout-grid", "Dashboard"], ["cpu", "My Devices"], ["database", "Metrics Studio"], ["radio", "Live Monitor"], ["chart-spline", "Analytics"], ["server", "Sensors"]];
  const other = [["settings", "Settings"], ["headset", "Help"]];
  const item = ([i, n], idx) => `<a class="${idx === p.nav ? "on" : ""}"><span>${ic(i)}</span>${n}</a>`;
  return `<section class="opt"><div class="opt-head"><h2>${p.name}${p.opts.length > 1 ? ` · Option ${k + 1}` : ""} · ${o.name}</h2><p>${o.note}</p></div>
    <div class="frame"><aside class="rail"><div class="brand">${mark("#d9d9d9", "#3a9542", 13)}Lectio</div><div class="cap">Main menu</div>
        <nav class="nav">${nav.map((n, i) => item(n, i)).join("")}</nav><div class="cap">Others</div><nav class="nav">${other.map((n, i) => item(n, i + 6)).join("")}</nav>
        <div class="acct"><div class="cap">User account</div><div class="who"><span class="ava">MW</span><span><b>Mugisha Witness</b><small>Account settings</small></span></div></div></aside>
      <main class="panel">${o.body()}</main></div></section>`;
}

const q = new URLSearchParams(location.search);
let page = q.get("p") || "devices";
function draw() {
  const only = q.get("l"), p = PAGES.find((x) => x.id === page);
  const pick = only ? "" : `<div class="pick">Page: ${PAGES.map((x) => `<button data-k="${x.id}" class="${x.id === page ? "on" : ""}">${x.name}</button>`).join("")}</div>`;
  document.getElementById("root").innerHTML = pick + p.opts.map((o, k) => (!only || +only === k + 1 ? frame(p, o, k) : "")).join("");
  lucide.createIcons({ attrs: { "stroke-width": 1.9 } });
  document.querySelectorAll(".pick button").forEach((b) => b.onclick = () => { page = b.dataset.k; draw(); scrollTo(0, 0); });
}
draw();
const fit = () => document.documentElement.style.setProperty("--zoom", Math.min(2.2, (innerWidth - 40) / 640).toFixed(3));
fit(); addEventListener("resize", fit);
})();
</script>
</body>
</html>
