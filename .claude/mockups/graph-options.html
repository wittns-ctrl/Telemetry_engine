<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live readings graph options</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #ebebed; font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: #0e0e10; }
  .opt { max-width: 1240px; margin: 0 auto 28px; }
  .opt h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
  .opt p { margin: 0 0 10px; font-size: 14px; color: #45454c; }
  .card { padding: 18px 22px 12px; border-radius: 14px; background: #fff; }
  .hd { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }
  .hd svg { width: 18px; height: 18px; }
  .hd .r { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 400; color: #5f5f68; }
  .chip { padding: 4px 10px; border-radius: 99px; background: #eaf5ec; font-size: 13px; font-weight: 600; color: #176b22; }
  .legend { display: flex; gap: 8px; margin: 12px 0 6px; }
  .legend span { display: flex; align-items: center; gap: 7px; padding: 5px 12px; border: 1px solid #d9d9dc; border-radius: 99px; font-size: 13px; font-weight: 500; }
  .legend b { font-weight: 700; }
  .plot { display: grid; grid-template-columns: 42px 1fr; }
  .y { position: relative; }
  .y span { position: absolute; right: 8px; transform: translateY(-50%); font-size: 12px; color: #5f5f68; }
  .area { position: relative; height: 230px; }
  .area svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .x { grid-column: 2; display: flex; justify-content: space-between; padding-top: 6px; font-size: 12px; color: #5f5f68; }
  .tag { position: absolute; right: -6px; transform: translate(100%, -50%); padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .multi { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 120px 1fr 64px; align-items: center; gap: 12px; }
  .row .nm { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .row .now { font-size: 18px; font-weight: 700; text-align: right; }
  .row .mini { position: relative; height: 62px; border-radius: 8px; background: #f5f5f6; }
  .row .mini svg { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const N = 60;
function wave(base, amp, seed, swing) {
  return Array.from({ length: N }, (_, i) => Math.max(0, Math.min(100, base + amp * Math.sin(i * 0.31 + seed) + amp * 0.5 * Math.sin(i * 0.9 + seed * 2) + (swing ? swing * Math.sin(i * 0.12 + seed) : 0))));
}
const CPU = wave(40, 4, 0.5, 2), GPU = wave(13, 2, 2.2, 0), RAM = wave(88, 5, 1.1, 8);
const pts = (vals) => vals.map((v, i) => `${(i / (N - 1) * 1000).toFixed(1)},${(300 - v * 3).toFixed(1)}`).join(" ");
const grid = [0, 25, 50, 75, 100].map((v) => `<line x1="0" x2="1000" y1="${300 - v * 3}" y2="${300 - v * 3}" stroke="#ebebed" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join("");
const yAxis = `<div class="y">${[100, 75, 50, 25, 0].map((v) => `<span style="top:${100 - v}%">${v}%</span>`).join("")}</div>`;
const xAxis = `<div class="x"><span>03:45:59 PM</span><span>03:46:19 PM</span><span>03:46:35 PM</span><span>03:46:45 PM</span><span>03:46:55 PM</span><span>03:47:05 PM</span></div>`;
const head = (extra = "") => `<div class="hd"><svg viewBox="0 0 24 24" fill="none" stroke="#1c7a2e" stroke-width="2"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>Live readings<span class="r">Last 60 readings<span class="chip">Live</span>${extra}</span></div>`;
const line = (vals, colour, width, dash = "") => `<polyline points="${pts(vals)}" fill="none" stroke="${colour}" stroke-width="${width}" stroke-linejoin="round" stroke-linecap="round" ${dash ? `stroke-dasharray="${dash}"` : ""} vector-effect="non-scaling-stroke"/>`;
const dot = (vals, colour, ring) => `<circle cx="1000" cy="${300 - vals[N - 1] * 3}" r="5" fill="${ring ? "#fff" : colour}" stroke="${colour}" stroke-width="${ring ? 2.5 : 0}" vector-effect="non-scaling-stroke"/>`;
const swatch = (colour, dash, width = 3) => `<svg width="22" height="8"><line x1="1" x2="21" y1="4" y2="4" stroke="${colour}" stroke-width="${width}" stroke-linecap="round" ${dash ? `stroke-dasharray="${dash}"` : ""}/></svg>`;
const now = (v) => Math.round(v[N - 1]) + "%";

const OPTIONS = [
  { key: "A", name: "Three distinct colours, no fill",
    note: "RAM brand green, CPU black, GPU grey. The green fill under CPU is removed, so no line hides behind another.",
    body() {
      return `${head()}<div class="legend"><span>${swatch("#1c7a2e")}RAM <b>${now(RAM)}</b></span><span>${swatch("#0e0e10")}CPU <b>${now(CPU)}</b></span><span>${swatch("#8e8e96")}GPU <b>${now(GPU)}</b></span></div>
        <div class="plot">${yAxis}<div class="area"><svg viewBox="0 0 1000 300" preserveAspectRatio="none">${grid}${line(RAM, "#1c7a2e", 3)}${line(CPU, "#0e0e10", 3)}${line(GPU, "#8e8e96", 3)}</svg></div>${xAxis}</div>`;
    } },
  { key: "B", name: "Colours plus line styles",
    note: "Each value also gets its own line pattern (solid, dashed, dotted), so they stay apart even in print or for colour-blind viewers.",
    body() {
      return `${head()}<div class="legend"><span>${swatch("#1c7a2e")}RAM <b>${now(RAM)}</b></span><span>${swatch("#0e0e10", "7 4")}CPU <b>${now(CPU)}</b></span><span>${swatch("#8e8e96", "1 5", 3.5)}GPU <b>${now(GPU)}</b></span></div>
        <div class="plot">${yAxis}<div class="area"><svg viewBox="0 0 1000 300" preserveAspectRatio="none">${grid}${line(RAM, "#1c7a2e", 3)}${line(CPU, "#0e0e10", 2.6, "9 6")}${line(GPU, "#8e8e96", 3.4, "1 7")}</svg></div>${xAxis}</div>`;
    } },
  { key: "C", name: "Colours plus value labels at the line ends",
    note: "Same colours as A, with a filled label at the end of each line showing its current value, so you read it without the legend.",
    body() {
      const tag = (vals, bg, fg, name) => `<span class="tag" style="top:${100 - vals[N - 1]}%;background:${bg};color:${fg}">${name} ${now(vals)}</span>`;
      return `${head()}<div class="legend"><span>${swatch("#1c7a2e")}RAM</span><span>${swatch("#0e0e10")}CPU</span><span>${swatch("#8e8e96")}GPU</span></div>
        <div class="plot" style="padding-right:84px">${yAxis}<div class="area"><svg viewBox="0 0 1000 300" preserveAspectRatio="none">${grid}${line(RAM, "#1c7a2e", 3)}${line(CPU, "#0e0e10", 3)}${line(GPU, "#8e8e96", 3)}${dot(RAM, "#1c7a2e", 1)}${dot(CPU, "#0e0e10", 1)}${dot(GPU, "#8e8e96", 1)}</svg>
        ${tag(RAM, "#1c7a2e", "#fff", "RAM")}${tag(CPU, "#0e0e10", "#fff", "CPU")}${tag(GPU, "#ebebed", "#0e0e10", "GPU")}</div>${xAxis}</div>`;
    } },
  { key: "D", name: "One strip per value",
    note: "Three small graphs stacked, one per value, each with its current number. Nothing overlaps at all.",
    body() {
      const strip = (name, vals, colour) => `<div class="row"><span class="nm">${swatch(colour)}${name}</span><div class="mini"><svg viewBox="0 0 1000 300" preserveAspectRatio="none"><polygon points="0,300 ${pts(vals)} 1000,300" fill="${colour}" opacity=".12"/>${line(vals, colour, 2.6)}</svg></div><span class="now">${now(vals)}</span></div>`;
      return `${head()}<div class="multi" style="margin-top:14px">${strip("RAM", RAM, "#1c7a2e")}${strip("CPU", CPU, "#0e0e10")}${strip("GPU", GPU, "#5f5f68")}</div><div class="x" style="margin-left:132px;margin-right:76px">${xAxis.replace('<div class="x">', "").replace("</div>", "")}</div>`;
    } },
];
document.getElementById("root").innerHTML = OPTIONS.map((o) => `<section class="opt"><h2>Option ${o.key} · ${o.name}</h2><p>${o.note}</p><div class="card">${o.body()}</div></section>`).join("");
</script>
</body>
</html>
